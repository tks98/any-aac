# Security updates come as soon as an advisory is published (turned on in the
# repository's settings). Other updates come once a month, grouped, so they're
# easy to review: CI checks each one, and nothing deploys until it's merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # TypeScript 7 (the Go compiler) isn't supported by typescript-eslint yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
