name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The symbol library's pinned Mulberry release (52 MB), fetched by the build.
      - uses: actions/cache@v6
        with:
          path: apps/web/.cache
          key: symbol-library-${{ hashFiles('apps/web/scripts/symbol-library.mjs') }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The symbol library's pinned Mulberry release (52 MB), fetched by the build.
      - uses: actions/cache@v6
        with:
          path: apps/web/.cache
          key: symbol-library-${{ hashFiles('apps/web/scripts/symbol-library.mjs') }}
      - run: pnpm --filter @any-aac/web exec playwright install --with-deps chromium webkit firefox
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
