name: Deploy to GitHub Pages

# Deploys main once CI has passed on it, so a failing build never reaches users.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # The symbol library's Mulberry release (52 MB) and the voices (282 MB),
      # both pinned and checked against their hashes. The site gets the voices
      # in half precision (148 MB), converted and checked again.
      - uses: actions/cache@v6
        with:
          path: apps/web/.cache
          key: release-files-${{ hashFiles('apps/web/scripts/symbol-library.mjs', 'apps/web/src/lib/voice/voices.json') }}
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_SELF_HOST_VOICES: 'true'
      # Voices are served from the site itself, so nothing is fetched from elsewhere.
      - run: node apps/web/scripts/self-host-voices.mjs apps/web/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
