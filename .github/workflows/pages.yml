name: Deploy to GitHub Pages

# Deploys each push to main, but only once CI (called below) has passed on that
# same commit, so a failing build never reaches users. Pull requests, forks
# included, can't trigger this: it runs on push to main of this repository only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    if: github.repository == 'tks98/any-aac' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-24.04
    # configure-pages reads the site's settings; nothing here can write to it.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The symbol library's Mulberry release (52 MB) and the voices (282 MB),
      # both pinned and checked against their hashes. The site gets the voices
      # in half precision (148 MB), converted and checked again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.cache
          key: release-files-${{ hashFiles('apps/web/scripts/symbol-library.mjs', 'apps/web/src/lib/voice/voices.json') }}
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_SELF_HOST_VOICES: 'true'
      # Voices are served from the site itself, so nothing is fetched from elsewhere.
      - run: node apps/web/scripts/self-host-voices.mjs apps/web/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  # The only job that can write to Pages. It runs no project code.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
